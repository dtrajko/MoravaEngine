# Builds MoravaEngine on every push to master and on pull requests; the Linux GCC builds also run a scene for a while
# (smoke test: no GPU on GitHub's runners, Mesa renders on the CPU). Release builds: faster, and far smaller than Debug's
# debug info.
name: Build

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'Screenshots/**']
  pull_request:
    paths-ignore: ['**.md', 'Screenshots/**']

# A new push cancels the run of the previous one on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SAMPLE_PROJECT_DIR: Projects/Sample

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Vulkan
            cc: gcc
            cxx: g++
            cmake-options: -DMORAVA_VULKAN=ON -DMORAVA_SCENE=ENV_MAP_VULKAN
            smoke-test: --scene Scenes/GI_Cube.mscene --exit-after 20 --play --debug-view 21
            player-smoke-test: true # the sample's pack, the player's smoke tests (Erika, Level 2) and the built game
          # Without -fno-pch-timestamp Clang rejects a precompiled header that ccache restored (its file time differs)
          - name: Clang Vulkan
            cc: clang
            cxx: clang++
            cmake-options: -DMORAVA_VULKAN=ON -DMORAVA_SCENE=ENV_MAP_VULKAN "-DCMAKE_CXX_FLAGS=-Xclang -fno-pch-timestamp"
          - name: GCC OpenGL
            cc: gcc
            cxx: g++
            cmake-options: -DMORAVA_OPENGL=ON -DMORAVA_SCENE=HAZEL_ENV_MAP
            smoke-test: --exit-after 20

    steps:
      # Only the latest commit (the history is ~700 MB), the submodules shallow too
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      # C# scripting: the .NET 10 SDK builds Morava.ScriptCore, and CMake copies the private .NET next to the executables
      # from the installed one (DOTNET_ROOT, which this sets)
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3 \
            libvulkan-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libgtk-3-dev zlib1g-dev             xvfb mesa-vulkan-drivers libgl1-mesa-dri vulkan-validationlayers

      # shaderc's own dependencies (glslang, SPIRV-Tools, SPIRV-Headers...): downloaded by its script, kept until shaderc changes
      - name: Cache shaderc dependencies
        id: shaderc-deps
        uses: actions/cache@v6
        with:
          path: vendor/cross-platform/shaderc/third_party
          key: shaderc-deps-${{ runner.os }}-${{ hashFiles('vendor/cross-platform/shaderc/DEPS') }}

      - name: Download shaderc dependencies
        if: steps.shaderc-deps.outputs.cache-hit != 'true'
        run: python3 vendor/cross-platform/shaderc/utils/git-sync-deps

      # Compiled files kept between runs: after the first run only what changed is compiled again
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-${{ matrix.name }}
          max-size: 2G

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMORAVA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.cmake-options }}

      # The precompiled header needs these for ccache to reuse results. -k 0: keep going after a failed file, so one run
      # reports every compile error, not only the first
      - name: Build
        env:
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: cmake --build build --parallel -- -k 0

      # The engine runs a scene for 20 s on a virtual screen (Xvfb) with Mesa's CPU drivers (lavapipe, llvmpipe), from the
      # fresh checkout. It fails on a crash, a hang (timeout), an exit code other than 0, a Vulkan validation message or a
      # file that can't be found or loaded (on Linux often a path whose letter case differs from the file's).
      - name: Smoke test
        if: matrix.smoke-test
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 600 build/MoravaEngine ${{ matrix.smoke-test }} 2>&1 | tee smoke-test.log
          if grep -q VulkanDebugCallback smoke-test.log; then
            echo "::error::Vulkan validation messages (see the log above or the smoke-test-log artifact)"
            exit 1
          fi
          if grep -E "Could not load texture|Failed to load image|doesn't exist|Failed to read" smoke-test.log; then
            echo "::error::Files that could not be found or loaded"
            exit 1
          fi
          if ! grep -q "C# scripting: .NET" smoke-test.log; then
            echo "::error::C# scripting: .NET didn't start from the private folder next to the executable"
            exit 1
          fi
          # --play: the editor ran the game, and at exit Stop brought the edited scene back unchanged
          if [[ "${{ matrix.smoke-test }}" == *--play* ]] && ! grep -q "the edited scene is back, unchanged" smoke-test.log; then
            echo "::error::Play mode: the game didn't run, or Stop didn't bring the edited scene back unchanged"
            exit 1
          fi

      # The editor cooks the sample into its pack, without a window: a missing asset fails here. The player runs from this
      # pack alone, and has neither assimp nor shaderc in it
      - name: Build the sample's pack
        if: matrix.player-smoke-test
        run: |
          set -o pipefail
          build/MoravaEngine --build-pack $SAMPLE_PROJECT_DIR/Sample.mproject 2>&1 | tee pack.log
          if nm build/MoravaPlayer | grep -E "Assimp8Importer|shaderc_compile_into"; then
            echo "::error::The player links assimp or shaderc"
            exit 1
          fi
          # Twice: nothing is cooked the second time
          build/MoravaEngine --build-pack $SAMPLE_PROJECT_DIR/Sample.mproject 2>&1 | tee pack2.log
          if ! grep -E "Pack: .*models: 0 imported.*material maps: 0 cooked" pack2.log; then
            echo "::error::The second build of the pack cooked something again"
            exit 1
          fi

      # The sample's Erika scene: cutout eyelashes, a controller with Footstep events, her sounds' files
      - name: Erika smoke test
        if: matrix.player-smoke-test
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 600 build/MoravaPlayer --pack $SAMPLE_PROJECT_DIR/Build/Game.mpak --scene Scenes/Erika.mscene --exit-after 10 --debug-overlay 2>&1 | tee erika-smoke-test.log
          if grep -q VulkanDebugCallback erika-smoke-test.log; then
            echo "::error::Vulkan validation messages (see the log above or the smoke-test-log artifact)"
            exit 1
          fi
          if grep -E "Could not load texture|Failed to load image|doesn't exist|Failed to read|could not be opened|binding of .* is left out" erika-smoke-test.log; then
            echo "::error::A model, texture or material of the Erika scene could not be found or loaded"
            exit 1
          fi
          if ! grep -q "Animation: 1 animator(s), 1 animating" erika-smoke-test.log || grep -E "Animator of |Animator '.*' could not be loaded|Animation: .*(could not be read|doesn't exist|has no animations)|event of state" erika-smoke-test.log; then
            echo "::error::Erika's animator didn't start, or a controller, clip or event of it couldn't be loaded (see the log)"
            exit 1
          fi
          if ! grep -q "Scripts: [1-9][0-9]* instance(s)" erika-smoke-test.log || grep -q "Script error:" erika-smoke-test.log; then
            echo "::error::The Erika scene's scripts didn't run, or one of them threw an exception (see the log)"
            exit 1
          fi
          # Played with the debug overlay (F3, 7.4) over it: drawn every frame with the game's numbers
          if ! grep -q "Debug overlay: shown" erika-smoke-test.log; then
            echo "::error::The player didn't show the debug overlay (--debug-overlay)"
            exit 1
          fi
          # The sounds her script plays at the animator's Footstep events, the jump and the landing
          for sound in Footstep_1 Footstep_2 Footstep_3 Footstep_4 JumpTakeoff Land; do
            test -f "$SAMPLE_PROJECT_DIR/Assets/Audio/$sound.wav" || { echo "::error::Erika's sound $sound.wav is missing"; exit 1; }
          done

      # The player (MoravaPlayer, without the editor) plays the coin collector's Level 2 (Milestone 2: the sea, the moving
      # platforms, the coins, the gate, its sounds and HUD) with the debug overlay. The project's start scene (the main menu)
      # is played by the built game below. This run also checks what every scene needs: the private .NET, the scripts,
      # the engine's self-tests, audio and the game UI's font
      - name: Collector smoke test
        if: matrix.player-smoke-test
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 600 build/MoravaPlayer --pack $SAMPLE_PROJECT_DIR/Build/Game.mpak --scene Scenes/Level2.mscene --exit-after 10 --debug-overlay 2>&1 | tee collector-smoke-test.log
          if grep -q VulkanDebugCallback collector-smoke-test.log; then
            echo "::error::Vulkan validation messages (see the log above or the smoke-test-log artifact)"
            exit 1
          fi
          if grep -E "Could not load texture|Failed to load image|doesn't exist|Failed to read|could not be opened|binding of .* is left out" collector-smoke-test.log; then
            echo "::error::A model, texture, material or scene of the collector could not be found or loaded"
            exit 1
          fi
          if ! grep -q "C# scripting: .NET" collector-smoke-test.log; then
            echo "::error::C# scripting: .NET didn't start from the private folder next to the executable"
            exit 1
          fi
          if grep -E "Scene: .*(not found|could not be loaded)|Input file .* could not be loaded" collector-smoke-test.log; then
            echo "::error::The project, its scene or its input file could not be found or opened"
            exit 1
          fi
          # The sample's C# scripts (built by CMake): loaded, their instances made, none of them threw, Level 2's started
          if ! grep -q "Scripts: [1-9][0-9]* instance(s)" collector-smoke-test.log || grep -E "Script error:|Scripts: .*(isn't in the game's assembly|no game assembly)" collector-smoke-test.log; then
            echo "::error::The sample's C# scripts didn't load or run, or one of them threw an exception (see the log)"
            exit 1
          fi
          if ! grep -q "Level 2: collect the 15 coins, then reach the goal" collector-smoke-test.log; then
            echo "::error::Level 2's scripts didn't start as expected (see the log)"
            exit 1
          fi
          # The engine's self-tests at the renderer's start: the scene (subtree copies) and prefabs (6.1)
          if grep -q "self-test failed" collector-smoke-test.log; then
            echo "::error::An engine self-test failed (see the log)"
            exit 1
          fi
          # Audio (5.1): miniaudio started (a runner has no sound card: the null device), the level's sounds were made
          if ! grep -q "Audio: miniaudio" collector-smoke-test.log || ! grep -q "Audio: [1-9][0-9]* sound(s)" collector-smoke-test.log || grep -E "Audio: .*can't be played|Audio: miniaudio could not start" collector-smoke-test.log; then
            echo "::error::Audio didn't start, or a sound of the level couldn't be loaded (see the log)"
            exit 1
          fi
          # The game UI (7.2): the HUD's font made into an atlas (or read from its cache), its text and images drawn
          if ! grep -E -q "UI font: '.*' (made|from the cache)" collector-smoke-test.log || grep -E "UI font: (can't|FreeType)|UI font: .*(isn't a font|has none of the characters|didn't fit)|UI image: can't" collector-smoke-test.log; then
            echo "::error::The game UI's font or an image of the HUD could not be loaded (see the log)"
            exit 1
          fi
          # Played with the debug overlay (F3, 7.4) over it
          if ! grep -q "Debug overlay: shown" collector-smoke-test.log; then
            echo "::error::The player didn't show the debug overlay (--debug-overlay)"
            exit 1
          fi

      # Build Game (Phase 11): the sample built into a folder of its own, with a .tar.gz of it beside it (11.6), which is unpacked
      # and run from another folder with the SDK's variable gone: it finds its pack and its private .NET beside itself, and the
      # archive kept the executable bits. Validation on (a shipped game has it off) so CI still checks it
      - name: Build and run the game
        if: matrix.player-smoke-test
        run: |
          set -o pipefail
          build/MoravaEngine --build-game $SAMPLE_PROJECT_DIR/Sample.mproject --build-output "$RUNNER_TEMP/Coin Collector" 2>&1 | tee build-game.log
          ARCHIVE="$RUNNER_TEMP/Coin_Collector-1.0.0-linux-x64.tar.gz"
          test -s "$ARCHIVE" || { echo "::error::Build Game made no .tar.gz"; exit 1; }
          mkdir -p "$RUNNER_TEMP/unpacked" && tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/unpacked"
          GAME="$RUNNER_TEMP/unpacked/Coin_Collector"
          ls -la "$GAME"
          test -x "$GAME/Coin_Collector" || { echo "::error::The archive's executable can't be run"; exit 1; }
          ldd "$GAME/Coin_Collector"
          readelf -d "$GAME/Coin_Collector" | grep -q 'R.*PATH.*\$ORIGIN' || { echo "::error::The player has no RPATH \$ORIGIN"; exit 1; }
          test -s "$GAME/THIRD_PARTY_NOTICES.txt" || { echo "::error::The game has no license notices"; exit 1; }
          if grep -aq "Scenes/Physics.mscene" "$GAME/Game.mpak"; then
            echo "::error::A scene the project's Build settings don't list went into the game"
            exit 1
          fi
          OUT="$PWD/game-smoke-test.log"
          (cd / && env -u DOTNET_ROOT xvfb-run -a -s '-screen 0 1920x1080x24' timeout 600 "$GAME/Coin_Collector" --validation --exit-after 15 2>&1 | tee "$OUT")
          if grep -q VulkanDebugCallback "$OUT"; then
            echo "::error::Vulkan validation messages (see the log above or the smoke-test-log artifact)"
            exit 1
          fi
          if grep -E "Could not load texture|Failed to load image|doesn't exist|Failed to read|could not be opened|Script error:" "$OUT"; then
            echo "::error::Something of the built game could not be found, loaded or run"
            exit 1
          fi
          if ! grep -q "Playing scene 'MainMenu'" "$OUT" || ! grep -q "C#: Options: " "$OUT" || ! grep -q "C# scripting: .NET .*unpacked/Coin_Collector/dotnet" "$OUT"; then
            echo "::error::The built game didn't start its main menu, with its scripts on its own .NET (see the log)"
            exit 1
          fi

          # 11.4: the player's settings in the user's folder. None at first: the GPU's quality tier; then the player's choices
          SETTINGS_FOLDER="$HOME/.config/Morava Games/Coin Collector"
          grep -q "Settings: none yet ('$SETTINGS_FOLDER/Settings.yaml')" "$OUT" || { echo "::error::The game's settings aren't looked for in the user's folder"; exit 1; }
          grep -q "Quality: .*(chosen for this GPU" "$OUT" || { echo "::error::The game didn't choose a quality tier for the GPU"; exit 1; }
          SETTINGS_LOG="$PWD/game-settings-test.log"
          mkdir -p "$SETTINGS_FOLDER"
          printf 'Player:\n  Quality: Low\n  Bindings:\n    Jump: [{Key: J}, {Gamepad: A}]\nSettings:\n  MouseSensitivity: 2\n' > "$SETTINGS_FOLDER/Settings.yaml"
          (cd / && xvfb-run -a -s '-screen 0 1920x1080x24' timeout 300 "$GAME/Coin_Collector" --exit-after 10 > "$SETTINGS_LOG" 2>&1) || true
          if ! grep -q "Quality: Low, the player's choice" "$SETTINGS_LOG" || ! grep -q "Input: the player's bindings of 1 action" "$SETTINGS_LOG" ||
             ! grep -q "C#: Options: .*mouse x2.00" "$SETTINGS_LOG"; then
            echo "::error::The player's settings weren't put in place (see game-settings-test.log)"
            exit 1
          fi
          rm "$SETTINGS_FOLDER/Settings.yaml"

          # 11.4: the log in the user's folder, and a forced crash that says so there
          USER_FOLDER="$HOME/.local/share/Morava Games/Coin Collector"
          grep -q "Playing scene 'MainMenu'" "$USER_FOLDER/Player.log" || { echo "::error::The game's log isn't in the user's folder"; exit 1; }
          test -n "$(ls "$USER_FOLDER"/FontCache/*.mfontcache)" || { echo "::error::The game's font cache isn't in the user's folder"; exit 1; }
          test ! -e "$GAME/Library" || { echo "::error::The game wrote into its own folder"; exit 1; }
          if (cd / && timeout 60 "$GAME/Coin_Collector" --exit-after 15 --crash-test start); then
            echo "::error::--crash-test didn't crash"
            exit 1
          fi
          grep -q "The game crashed" "$USER_FOLDER/Player.log" || { echo "::error::A crash left no line in the log"; exit 1; }

      - name: Smoke test log
        if: always() && (matrix.smoke-test || matrix.player-smoke-test)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-test-log-linux-${{ strategy.job-index }}
          path: |
            smoke-test.log
            erika-smoke-test.log
            collector-smoke-test.log
            build-game.log
            game-smoke-test.log
            game-settings-test.log
          if-no-files-found: ignore

  # One job per graphics API: each compiles only its own API's code, so a missing #if or include shows up here
  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC Vulkan
            cmake-options: -DMORAVA_VULKAN=ON -DMORAVA_SCENE=ENV_MAP_VULKAN
          - name: MSVC OpenGL
            cmake-options: -DMORAVA_OPENGL=ON -DMORAVA_SCENE=HAZEL_ENV_MAP
          - name: MSVC DirectX 11
            cmake-options: -DMORAVA_DIRECTX11=ON -DMORAVA_SCENE=DX11

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # CMake always needs Vulkan's headers and vulkan-1.lib; the version of the SDK used for development
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.357.0
          cache: true

      - name: Cache shaderc dependencies
        id: shaderc-deps
        uses: actions/cache@v6
        with:
          path: vendor/cross-platform/shaderc/third_party
          key: shaderc-deps-${{ runner.os }}-${{ hashFiles('vendor/cross-platform/shaderc/DEPS') }}

      - name: Download shaderc dependencies
        if: steps.shaderc-deps.outputs.cache-hit != 'true'
        run: python vendor/cross-platform/shaderc/utils/git-sync-deps

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-${{ matrix.name }}
          max-size: 2G

      # Ninja (for ccache) needs the MSVC environment of vcvars64.bat, which lasts for one step only: configure and build
      # together. cmd doesn't stop at a failed command by itself, hence the "|| exit /b 1"
      - name: Configure and build
        shell: cmd
        env:
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMORAVA_WARNINGS_AS_ERRORS=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.cmake-options }} || exit /b 1
          cmake --build build --parallel -- -k 0 || exit /b 1

      # Build Game (Phase 11) on Windows: no GPU to run it on here, but the folder is made, with the icon and the version in the
      # executable (the Linux and macOS jobs run theirs)
      - name: Build the game
        if: matrix.name == 'MSVC Vulkan'
        shell: pwsh
        run: |
          build\MoravaEngine.exe --build-game Projects\Sample\Sample.mproject --build-output "$env:RUNNER_TEMP\Coin Collector"
          if ($LASTEXITCODE -ne 0) { Write-Error "Build Game failed"; exit 1 }
          $info = (Get-Item "$env:RUNNER_TEMP\Coin Collector\Coin_Collector.exe").VersionInfo
          if ($info.ProductName -ne 'Coin Collector' -or $info.FileVersion -ne '1.0.0') { Write-Error "The executable has no version information"; exit 1 }
          foreach ($file in 'Game.mpak', 'Sample.dll', 'nethost.dll', 'Morava.ScriptCore.dll', 'THIRD_PARTY_NOTICES.txt', 'dotnet\host\fxr') {
            if (-not (Test-Path "$env:RUNNER_TEMP\Coin Collector\$file")) { Write-Error "The game has no $file"; exit 1 }
          }
          # 11.4: no console window; a crash (before any window: no GPU here) leaves a dump and a line in the log, in the user's folder
          $exe = "$env:RUNNER_TEMP\Coin Collector\Coin_Collector.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ([BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 24 + 68) -ne 2) { Write-Error "The game would open a console window"; exit 1 }
          $crash = Start-Process -FilePath $exe -ArgumentList '--exit-after', '15', '--crash-test', 'start' -PassThru -Wait
          if ($crash.ExitCode -eq 0) { Write-Error "--crash-test didn't crash"; exit 1 }
          $userFolder = "$env:LOCALAPPDATA\Morava Games\Coin Collector"
          if (-not (Test-Path "$userFolder\Crash_1.0.0_*.dmp")) { Write-Error "A crash left no dump"; exit 1 }
          if (-not (Select-String -Path "$userFolder\Player.log" -Pattern 'The game crashed' -Quiet)) { Write-Error "A crash left no line in the log"; exit 1 }

      # 11.2: the player template other editors build Windows games with (Tools/Get-PlayerTemplates.ps1), and the player's
      # symbols, kept apart: a crash dump from a game built with this template is read with them
      - name: Player template
        if: matrix.name == 'MSVC Vulkan'
        shell: pwsh
        run: |
          cmake -DBUILD_DIR=build -DOUTPUT=player-template -P cmake/PlayerTemplate.cmake
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path build\MoravaPlayer.pdb)) { Write-Error "The Release player has no symbols"; exit 1 }

      - name: Upload the player template
        if: matrix.name == 'MSVC Vulkan'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: player-template-win-x64
          path: player-template/
          if-no-files-found: error

      - name: Upload the player's symbols
        if: matrix.name == 'MSVC Vulkan'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: player-symbols-win-x64
          path: build/MoravaPlayer.pdb
          if-no-files-found: error

  # The Linux player template (11.2, 11.6), built on the oldest Ubuntu GitHub runs: a program needs the glibc it was built with
  # or a newer one, so a game made with it runs on more distributions (22.04: glibc 2.35) than one from 24.04's (2.39). Only the
  # player: the editor that builds games is the 24.04 job's. Vulkan's headers from LunarG's SDK (22.04's are older than the
  # engine's code asks for); at run time the system's libvulkan.so.1
  linux-player-template:
    name: Linux player template
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.357.0
          cache: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3 g++-12 \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libgtk-3-dev zlib1g-dev

      - name: Cache shaderc dependencies
        id: shaderc-deps
        uses: actions/cache@v6
        with:
          path: vendor/cross-platform/shaderc/third_party
          key: shaderc-deps-${{ runner.os }}-${{ hashFiles('vendor/cross-platform/shaderc/DEPS') }}

      - name: Download shaderc dependencies
        if: steps.shaderc-deps.outputs.cache-hit != 'true'
        run: python3 vendor/cross-platform/shaderc/utils/git-sync-deps

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-player-template
          max-size: 1G

      - name: Configure
        env:
          CC: gcc-12
          CXX: g++-12
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DMORAVA_VULKAN=ON -DMORAVA_SCENE=ENV_MAP_VULKAN

      - name: Build the player
        env:
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: cmake --build build --parallel --target MoravaPlayer -- -k 0

      # The newest glibc version the player asks for: what a Linux machine needs at least
      - name: Player template
        run: |
          cmake -DBUILD_DIR=build -DOUTPUT=player-template -P cmake/PlayerTemplate.cmake
          echo "The player needs glibc $(objdump -T build/MoravaPlayer | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | cut -d_ -f2) or newer"
          readelf -d build/MoravaPlayer | grep -E 'NEEDED|R.*PATH'

      - name: Upload the player template
        uses: actions/upload-artifact@v7.0.2
        with:
          name: player-template-linux-x64
          path: player-template/
          if-no-files-found: error
