# macOS builds (Apple Silicon), on the same triggers as build.yml: a separate workflow, not a required check, until the
# engine's warnings on Apple Clang are fixed; then the jobs move into build.yml with warnings as errors. The build keeps
# going after errors (-k 0), so one run lists every compile error. Vulkan comes from Homebrew (MoltenVK, loader,
# validation layer).
name: macOS

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'MoravaEngine/Screenshots/**']
  pull_request:
    paths-ignore: ['**.md', 'MoravaEngine/Screenshots/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang Vulkan
            cmake-options: -DMORAVA_VULKAN=ON -DMORAVA_SCENE=ENV_MAP_VULKAN
            smoke-test: --scene Scenes/GI_Cube.mscene --exit-after 20 --play
            # A project outside the engine's folder (Projects/Sample): its start scene, its own materials, its window
            player-smoke-test: --project ../Projects/Sample/Sample.mproject --exit-after 20
          # macOS stops at OpenGL 4.1: an older scene (HAZEL_ENV_MAP needs 4.5)
          - name: Clang OpenGL
            cmake-options: -DMORAVA_OPENGL=ON -DMORAVA_SCENE=EDITOR_IMGUIZMO
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      # C# scripting: the .NET 10 SDK builds Morava.ScriptCore, and CMake copies the private .NET next to the executables
      # from the installed one (DOTNET_ROOT, which this sets)
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install packages
        run: brew install molten-vk vulkan-loader vulkan-headers vulkan-validationlayers ninja coreutils

      # The loader may not search Homebrew's folders: point it at MoltenVK's driver file and the validation layer
      - name: Vulkan environment
        run: |
          prefix=$(brew --prefix)
          icd=$(find "$prefix/etc/vulkan" "$prefix/share/vulkan" -name 'MoltenVK_icd.json' 2>/dev/null | head -1)
          layer=$(find "$prefix/share/vulkan" "$prefix/etc/vulkan" -name 'VkLayer_khronos_validation.json' 2>/dev/null | head -1)
          echo "MoltenVK driver: $icd, validation layer: $layer"
          [ -n "$icd" ] && echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          [ -n "$layer" ] && echo "VK_ADD_LAYER_PATH=$(dirname "$layer")" >> "$GITHUB_ENV"
          true

      - name: Cache shaderc dependencies
        id: shaderc-deps
        uses: actions/cache@v6
        with:
          path: vendor/cross-platform/shaderc/third_party
          key: shaderc-deps-${{ runner.os }}-${{ hashFiles('vendor/cross-platform/shaderc/DEPS') }}

      - name: Download shaderc dependencies
        if: steps.shaderc-deps.outputs.cache-hit != 'true'
        run: python3 vendor/cross-platform/shaderc/utils/git-sync-deps

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos-${{ matrix.name }}
          max-size: 2G

      - name: Configure
        run: >
          cmake -S MoravaEngine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache
          ${{ matrix.cmake-options }}

      # The log keeps every error; the summary lists each distinct one once, with how many times it occurred
      - name: Build
        env:
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          set -o pipefail
          status=0
          cmake --build build --parallel -- -k 0 2>&1 | tee build.log || status=$?
          echo "== $(grep -c ' error: ' build.log) errors, $(grep -c ' warning: ' build.log) warnings; failed files: $(grep -c '^FAILED: ' build.log)"
          grep ' error: ' build.log | sed -E 's/^.*\/(src|vendor)\//\1\//' | sort | uniq -c | sort -rn | head -150 || true
          exit $status

      # As on Linux: the scene runs for 20 s (the runner's desktop session, MoltenVK on the virtual GPU, no ray tracing).
      # Fails on a crash, a hang, an exit code other than 0, a Vulkan validation message or a file that can't be loaded
      - name: Smoke test
        if: matrix.smoke-test
        working-directory: MoravaEngine
        env:
          VK_LOADER_DEBUG: error,warn
        run: |
          set -o pipefail
          gtimeout 600 ../build/MoravaEngine ${{ matrix.smoke-test }} 2>&1 | tee smoke-test.log
          if grep -q VulkanDebugCallback smoke-test.log; then
            echo "::error::Vulkan validation messages (see the log above or the smoke-test-log artifact)"
            exit 1
          fi
          if grep -E "Could not load texture|Failed to load image|doesn't exist|Failed to read" smoke-test.log; then
            echo "::error::Files that could not be found or loaded"
            exit 1
          fi
          if ! grep -q "C# scripting: .NET" smoke-test.log; then
            echo "::error::C# scripting: .NET didn't start from the private folder next to the executable"
            exit 1
          fi
          # --play: the editor ran the game, and at exit Stop brought the edited scene back unchanged
          if [[ "${{ matrix.smoke-test }}" == *--play* ]] && ! grep -q "the edited scene is back, unchanged" smoke-test.log; then
            echo "::error::Play mode: the game didn't run, or Stop didn't bring the edited scene back unchanged"
            exit 1
          fi

      # The player (MoravaPlayer, without the editor) plays a project's start scene the same way, and fails on the same
      # things, and on the project's files that could not be found
      - name: Player smoke test
        if: matrix.player-smoke-test
        working-directory: MoravaEngine
        env:
          VK_LOADER_DEBUG: error,warn
        run: |
          set -o pipefail
          gtimeout 600 ../build/MoravaPlayer ${{ matrix.player-smoke-test }} 2>&1 | tee player-smoke-test.log
          if grep -q VulkanDebugCallback player-smoke-test.log; then
            echo "::error::Vulkan validation messages (see the log above or the smoke-test-log artifact)"
            exit 1
          fi
          if grep -E "Could not load texture|Failed to load image|doesn't exist|Failed to read" player-smoke-test.log; then
            echo "::error::Files that could not be found or loaded"
            exit 1
          fi
          if ! grep -q "C# scripting: .NET" player-smoke-test.log; then
            echo "::error::C# scripting: .NET didn't start from the private folder next to the executable"
            exit 1
          fi
          if grep -E "Scene: .*(not found|could not be loaded)|could not be opened|Input file .* could not be loaded|binding of .* is left out" player-smoke-test.log; then
            echo "::error::The project, its scene, its input file, or a model or material of the scene could not be found or opened"
            exit 1
          fi
          # The sample's C# scripts (built by CMake): loaded, their instances made, and none of them threw
          if ! grep -q "Scripts: [1-9][0-9]* instance(s)" player-smoke-test.log || grep -E "Script error:|Scripts: .*(isn't in the game's assembly|no game assembly)" player-smoke-test.log; then
            echo "::error::The sample's C# scripts didn't load or run, or one of them threw an exception (see the log)"
            exit 1
          fi
          # The engine's self-tests at the renderer's start: the scene (subtree copies) and prefabs (6.1)
          if grep -q "self-test failed" player-smoke-test.log; then
            echo "::error::An engine self-test failed (see the log)"
            exit 1
          fi
          # Audio (5.1): miniaudio started (a runner has no sound card: the null device), the sample's sounds were made
          if ! grep -q "Audio: miniaudio" player-smoke-test.log || ! grep -q "Audio: [1-9][0-9]* sound(s)" player-smoke-test.log || grep -E "Audio: .*can't be played|Audio: miniaudio could not start" player-smoke-test.log; then
            echo "::error::Audio didn't start, or a sound of the sample couldn't be loaded (see the log)"
            exit 1
          fi

      - name: Smoke test log
        if: always() && (matrix.smoke-test || matrix.player-smoke-test)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-test-log-macos-${{ strategy.job-index }}
          path: |
            MoravaEngine/smoke-test.log
            MoravaEngine/player-smoke-test.log
          if-no-files-found: ignore

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-build-log-${{ strategy.job-index }}
          path: build.log
          if-no-files-found: ignore
