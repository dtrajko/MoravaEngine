# Probe of GitHub's macOS runner (Apple Silicon), before the macOS port: what Vulkan through MoltenVK and OpenGL offer
# there, whether a window, a Vulkan swapchain and an OpenGL context work (.github/probe/macos_probe.c), and how far the
# engine's CMake configure gets. Runs on pushes to the ci-macos branch, or by hand; not a required check.
name: macOS probe

on:
  push:
    branches: [ci-macos]
  workflow_dispatch:

jobs:
  probe:
    name: macOS probe
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Runner
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType
          xcode-select -p
          clang --version
          cmake --version

      # MoltenVK, the Vulkan loader and validation layer from Homebrew (the Vulkan SDK can replace them for the engine)
      - name: Install packages
        run: brew install molten-vk vulkan-loader vulkan-headers vulkan-tools vulkan-validationlayers glfw ninja

      # The loader may not search Homebrew's folders: point it at MoltenVK's driver file and the validation layer
      - name: Vulkan environment
        run: |
          prefix=$(brew --prefix)
          find "$prefix/etc/vulkan" "$prefix/share/vulkan" -name '*.json' 2>/dev/null || true
          icd=$(find "$prefix/etc/vulkan" "$prefix/share/vulkan" -name 'MoltenVK_icd.json' 2>/dev/null | head -1)
          layer=$(find "$prefix/share/vulkan" "$prefix/etc/vulkan" -name 'VkLayer_khronos_validation.json' 2>/dev/null | head -1)
          echo "MoltenVK driver: $icd"
          echo "Validation layer: $layer"
          [ -n "$icd" ] && echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          [ -n "$layer" ] && echo "VK_ADD_LAYER_PATH=$(dirname "$layer")" >> "$GITHUB_ENV"
          true

      - name: vulkaninfo
        run: |
          vulkaninfo --summary
          vulkaninfo > vulkaninfo.txt 2>&1 || true
          echo "== Of interest to the engine"
          grep -E "apiVersion|driverName|driverInfo|deviceName|wideLines|fillModeNonSolid|pipelineStatisticsQuery|samplerAnisotropy|imageCubeArray|geometryShader|tessellationShader|shaderStorageImageWriteWithoutFormat|descriptorIndexing|bufferDeviceAddress|rayQuery|rayTracingPipeline|accelerationStructure|portability_subset|maxBoundDescriptorSets|maxPerStageDescriptorSampledImages|maxPerStageDescriptorStorageImages|maxComputeWorkGroupInvocations|maxPushConstantsSize" vulkaninfo.txt | sed 's/^[[:space:]]*//' | sort -u

      - name: Window, Vulkan and OpenGL probe
        run: |
          prefix=$(brew --prefix)
          clang -std=c11 -Wall .github/probe/macos_probe.c -o macos-probe -I"$prefix/include" -L"$prefix/lib" \
            -Wl,-rpath,"$prefix/lib" -lglfw -lvulkan -framework OpenGL
          set -o pipefail
          ./macos-probe 2>&1 | tee macos-probe.log
          if grep -q "Validation Error" macos-probe.log; then
            echo "::warning::Vulkan validation messages in the probe"
          fi

      # The engine's configure only (no build yet): the first CMake errors on macOS
      - name: Cache shaderc dependencies
        id: shaderc-deps
        uses: actions/cache@v6
        with:
          path: vendor/cross-platform/shaderc/third_party
          key: shaderc-deps-${{ runner.os }}-${{ hashFiles('vendor/cross-platform/shaderc/DEPS') }}

      - name: Download shaderc dependencies
        if: steps.shaderc-deps.outputs.cache-hit != 'true'
        run: python3 vendor/cross-platform/shaderc/utils/git-sync-deps

      - name: Configure the engine
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -S MoravaEngine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMORAVA_VULKAN=ON -DMORAVA_SCENE=ENV_MAP_VULKAN 2>&1 | tee configure.log

      - name: Probe logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-probe
          path: |
            vulkaninfo.txt
            macos-probe.log
            configure.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
